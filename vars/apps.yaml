---
applications:
  kube-flannel:
    flannel:
  gateway:
    traefik:
  istio-system:
    istiod-config:
    istiod:
  auth:
    hydra:
      storage:
      - name: hydra
        size: 5Mi
      network:
        svcPort: 4444
        svcName: hydra-public
        prefix: /hydra
      vars:
        admin_port: 4445
        public_port: 4444
        cookie_secret: "{{ auth.hydra_cookie_secret }}"
        system_secret: "{{ auth.hydra_system_secret }}"
        clientID: "{{ auth.client_id }}"
        clientSecret: "{{ auth.client_secret }}"
        oauth2_path: "{{ net.oauth2_path }}"
    idp:
      network: true
    oauth2-proxy:
      network:
        svcPort: 80
        prefix: "{{ net.oauth2_path }}"
        rewrite: "{{ net.oauth2_path }}/"
      vars:
        oauth2_path: "{{ net.oauth2_path }}"
        cookie_secret: "{{ auth.oauth2_proxy_cookie_secret }}"
        clientID: "{{ auth.client_id }}"
        clientSecret: "{{ auth.client_secret }}"
  home:
    #grott:
    #  git: "{{ own_git_url }}"
    #  subdir: charts/grott
    zigbee2mqtt:
      flags: ['no strip']
      affinity: k8s-2-int.adm13
      network:
        rewrite: /zigbee2mqtt
      storage:
      - name: data-zigbee2mqtt-0
        type: longhorn
        size: 100Mi
    mosquitto:
      storage:
      - name: data-mosquitto-0
        type: longhorn
        size: 3Mi
    home-assistant:
      storage:
      - name: home-assistant
        size: 100Mi
        config: true
      network:
        prefix: "/"
        domain: ha.my-lb.adm13
      requires:
      - XXtype: postgresql
        name: postgresql
        namespace: db
        config:
          database: ha
          username: ha
          password: same
  tools:
    tester:
    colombo:
      images:
      - python3
      - fastapi
      network:
        publish: false
        allow:
        - name: infopage
          namespace: tools
          dest: api
      storage:
      - size: 500Mi
        type: longhorn
    infopage:
      images:
      - fastapi
      network: true
      storage:
      - name: infopage
        size: 5Mi
        type: local_folder
        config: true
  db:
    postgresql:
      kustom:
        user: "{{ service_secrets | selectattr('type', 'match', 'db') | selectattr('name', 'match', 'postgres') | map(attribute='values') | map(attribute='username') | first }}"
        pass: "{{ service_secrets | selectattr('type', 'match', 'db') | selectattr('name', 'match', 'postgres') | map(attribute='values') | map(attribute='password') | first }}"
        trustedSubnet: "{{ k8s.podSubnet }}"
        runAs: "{{ lookup('pipe', 'id -u postgres') | int }}"
        dataPath: /var/lib/postgresql
        confPath: /conf
      vars:
        service_name: postgres
        service_port: 5432
      storage: 
      - name: data-postgres-0
        type: longhorn
        size: 2Gi
  kube-system:
    kube-network-policies:
  kubext:
    service-check:
      images:
      - curl
    curator:
      images:
      - python-operator
      network: true
      storage:
      - size: 1Mi
        type: local_folder
        config: true
    valmut:
      images:
      - fastapi
      storage: 
      - type: local_folder
        size: 10Mi
        config: true
    descheduler:
      images:
      - descheduler
  longhorn-system:
    longhorn:
      network:
        svcName: longhorn-frontend
        prefix: /longhorn
        svcPort: 80
