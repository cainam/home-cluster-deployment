---
k8s_check_file: /etc/kubernetes/kubelet.conf
kubelet_config: /var/lib/kubelet/config.yaml
k8s_version: "{{ software.kubernetes.version|string }}"
controlPlaneEndpoint: "k8s.adm13:7443"
k8s_log_directory: /var/log/kubernetes
serviceSubnet: 10.96.0.0/12
longhorn_disk: "{{ local_disk_directory }}/longhorn-1.disk"
longhorn_size: 10G
kubernetes_image_section: k8s

k8s_images:
- name: etcd
  section: k8s
  requires:
  - go
  build:
    configure_rootfs_build: |
      git clone  --depth 1 --single-branch -b "{{ software.etcd.version }}" https://github.com/etcd-io/etcd.git
      cd etcd
      GO_LDFLAGS="-w -s" make build
      cp -dp bin/* "${ROOT}/bin"
- name: registry
  section: local
  type: gentoo-image-builder
  requires:
  - go
  build:
    entrypoint: ["/bin/registry"]
    configure_rootfs_build: |
      git clone -b "{{ software.registry.version }}" https://github.com/distribution/distribution.git
      cd distribution
      make bin/registry
      strip bin/registry
      mkdir -p "${ROOT}/bin" && mv bin/registry "${ROOT}/bin/"
      cd ..
      rm -rf distribution /root/.??* /root/*

