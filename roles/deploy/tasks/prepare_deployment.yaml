# testing examples: '\{\"limit_application\":[\"x\",\"y\"]}'  '\{\"limit_application\":\"x1y\"}' '{"limit_application":[infopage,tor],"limit_namespace":[tools]}' '{"limit_application":[1a1],"limit_namespace":[ns2]}'

- block: 
  - set_fact:
      apps: "{{ applications }}"
      net_routes: []
      application_playbooks: {}
      local_playbook_temp: "{{ remote_temp }}/{{ own_git_url | basename | split('.') | first }}"

  - name: "clone application playbooks to Ansible Controller"
    ansible.builtin.git:
      repo: '{{ applications_git }}'
      dest: "{{ local_playbook_temp }}/applications"
      depth: 1
      force: yes
    delegate_to: localhost

- block:
  - name: add missing namespaces to net.routes
    set_fact:
      net_routes: >-
        {{ net_routes + [
            item | combine({
              'namespace': item.namespace if item.namespace is defined
                else ( apps | dict2items | selectattr('value', 'defined') | selectattr('value', 'contains', item.gateway) | map(attribute='key') | first ),
              'app_instance': (item.app_instance if item.app_instance is defined
                else ( item.domain if item.gateway == 'istio' else item.gateway))|replace('.', '-')
            })
          ]
        }}
    loop: "{{ net.routes }}"
  
  - name: replace net.routes with normalized routes
    set_fact:
      net: "{{ net | combine({'routes': net_routes}, recursive=True) }}"
      app_list: []
      
# add istio gateways as application to list of applications
  - name: combine istio gateway deployment into applications # all raw items have to be treated before! # merge from gateway_install + optional additional_ports on individual gateway
    set_fact:
      apps: |
        {%- set domain_list = [item.domain] -%}
        {%- if item.endpointIP is defined -%}
        {%- set _d = domain_list.append(net.domain_external) -%}
        {%- endif -%}
        {{ apps | combine( {item.namespace: {item.app_instance: {'deployment_type': 'kustomize', 'flags': ['certs'], 'images': ['proxyv2'], 'kustom': {'application': 'gateway'}} | combine(
                     {'network':{ 
                          'hosts': domain_list,
                          'domain': item.domain
                     }})
        }}, recursive=true)}}
    loop: "{{ net.routes | selectattr('gateway','equalto','istio') }}"

  - name: application list with Istio gateways added
    debug:
      msg: 'apps: {{ apps | to_yaml }}'
    when: "'debug' in ansible_run_tags"
    failed_when: false

# flatten apps to app_list making namespace an attribute
  - debug: 
      msg: "{{item.key}}: {{ item.value }}\n{{ names | zip(item.value| dict2items| map(attribute='value') ) | to_nice_yaml }}" # create array from names and application values
    vars:
      app_name: "{{ item.value | dict2items | map(attribute='key') }}"   # get application name
      names: "{{ (app_name) | zip(([item.key]*(app_name|length))   ) }}" # create array of application and namespace name
    loop: "{{ apps |dict2items}}"

  - name: flatten app list - add arrays of namespace and application name to each application dict
    set_fact:
      app_temp: "{{ app_temp | default([]) + (names | zip(item.value| dict2items| map(attribute='value') )) }}" # create array from names and application values
    vars:
      app_name: "{{ item.value | dict2items | map(attribute='key') }}"   # get application name 
      names: "{{ (app_name) | zip(([item.key]*(app_name|length))   ) }}" # create array of application and namespace name
    loop: "{{ apps |dict2items}}"

  - name: flatten app list - transform temporary array values of namespace and application name into dict items
    vars:
      y: "{{ {'namespace':item[0][1],'name':item[0][0]} | combine(item[1]) }}" # turn names array item[0] into dict
    set_fact:
      app_list_from_dict: "{{ (app_list_from_dict|default([])) + [y] }}"
    loop: "{{ app_temp }}"

# apply defaults and requirements
  - name: apply defaults and requirements
    vars:
      my_dom: "{{ app.network.domain|default(net.base_domain) }}"
      my_route: "{{ net.routes | selectattr('domain','equalto',my_dom)|first }}"
      to_publish: "{{ (app.network is defined and app.network is boolean and app.network) or (app.network is defined and app.network is mapping) }}"
      my_gw_rq: >-
        {{
         { 'name': my_route.app_instance,
         'namespace': my_route.namespace,
         } }}
      # every requirement entry carries a namespace: an explicit one from vars/apps.yaml
      # wins, otherwise the requiring application's own namespace is used. Applied here so
      # all later consumers (BFS, bind phase, provides hooks) never need a fallback lookup.
      rq: >-
        {%- set out = [] -%}
        {%- for r in (app.requires | default([]) | list) + ([my_gw_rq] if to_publish else []) -%}
        {%-   set _ = out.append({'namespace': app.namespace} | combine(r)) -%}
        {%- endfor -%}
        {{ out }}
      storage_new: |
        {%- set updated_list = [] -%}
        {%- for item in (app.storage | default([])) -%}
          {%- set path_prefix = local_disk_directory if item.type == 'local_folder' else shared_mounts -%}
          {%- set _ = updated_list.append({'name': app.name, 'dest_dir': [path_prefix, item.name|default(app.name)] | join('/') } | combine(item)) -%}
        {%- endfor -%}
        {{ updated_list }}
      security:
        runAsUser: "{{ applicationSecurity[app.name].runAsUser | default((2**31-1)|random(65536)) }}"
        runAsGroup: "{{ applicationSecurity[app.name].runAsGroup | default((2**31-1)|random(65536)) }}"
        fsGroup: "{{ applicationSecurity[app.name].fsGroup | default((2**31-1)|random(65536)) }}"
        directoryMode: "{{ applicationSecurity[app.name].directoryMode | default('700') }}"
        fileMode: "{{ applicationSecurity[app.name].fileMode| default('600') }}"
      network_defaults:
        rewrite: ""
        svcPort: "{{ 65536|random(1024) }}"
        svcName: "{{ app.name }}"
        prefix: "{{ '/'~app.name}}"
        domain: "{{ my_dom  }}"
        publish: "{{ to_publish }}"
        hosts: |
          {%- set domain_list = [my_dom] -%}
          {%- if my_route.endpointIP is defined -%}
          {%- set _d = domain_list.append(net.domain_external) -%}
          {%- endif -%}
          {{ domain_list }}
      networkAsDict: "{{ (app.network is defined and app.network is boolean) | ternary({}, (app.network if app.network is defined else {})) }}"
      network: "{{ network_defaults | combine(networkAsDict, recursive=true) }}"
      new_entry: "{{app  | combine({'requires': rq, 'network': network, 'security': security, 'flags': app.flags|default([]), 'storage': storage_new }, recursive=true) }}"
    set_fact:
      app_list: "{{ app_list+[new_entry] }}"
    loop: "{{ app_list_from_dict }}"
    loop_control:
      loop_var: app

# fail early on typo'd or ambiguous requirement names instead of resolving them silently
  - name: validate requirement references
    vars:
      app_names: "{{ app_list | map(attribute='name') | list }}"
      req_names: "{{ app_list | map(attribute='requires') | flatten | map(attribute='name') | list | unique }}"
      duplicate_names: >-
        {%- set ns = namespace(items=[]) -%}
        {%- for name, group in app_list | groupby('name') -%}
        {%-   if group | length > 1 -%}{%- set _ = ns.items.append(name) -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.items }}
      missing: "{{ req_names | difference(app_names) }}"
      ambiguous: "{{ req_names | select('in', duplicate_names) | list }}"
    fail:
      msg: >-
        Invalid application requirements.
        Unknown names: {{ (missing | join(', ')) if missing else '-' }}.
        Names defined in multiple namespaces: {{ (ambiguous | join(', ')) if ambiguous else '-' }}.
        Fix or qualify the requires entries in vars/apps.yaml.
    when: (missing | length > 0) or (ambiguous | length > 0)

## build only_apps list from limit_application and limit_namespace variables
  - name: assign limit_namespace to fact
    set_fact:
      only_ns: "{{ limit_namespace }}"
    when: limit_namespace is defined

  - name: assign limit_application to fact
    set_fact:
      only_apps: "{{ limit_application }}"
    when: limit_application is defined

  - set_fact:
      only_apps: "{{[only_apps,]}}"
    when: only_apps is defined and only_apps is string
    
  - set_fact:
      only_ns: "{{[only_ns,]}}"
    when: only_ns is defined and only_ns is string

    # if namespace limitation given, add all applications of the namespace(s) to the list of limited applications
  - name: apps from limit_namespace
    block:
    - debug: 
       msg: "{{ item }}: apps: {{ app_list | selectattr('namespace', 'eq', item)| map(attribute='name') }}"
      loop: "{{ only_ns }}"
    - set_fact:
        only_apps: "{{ (only_apps|default([])) + app_list | selectattr('namespace', 'eq', item)| map(attribute='name') }}"
      loop: "{{ only_ns }}"
    when: only_ns is defined

  - debug:
      msg: "only_apps prepared:{{ only_apps }}"
    when: only_apps is defined

# combine all multi-level requirements into requires (cycle-safe BFS with a visited set)
# list mutation (pop/append) is used instead of rebinding, because Jinja loop scoping
# discards reassignments; seen starts with the app itself, so cycles terminate and no
# app ends up in its own requires. First occurrence of a name wins if it is required
# through several paths with different config values.
  - name: merge application requirements
    set_fact:
      app_list: >-
        {%- set resolved = [] -%}
        {%- for app in app_list -%}
          {%- set seen = [app.name] -%}
          {%- set queue = [app.name] -%}
          {%- set all_reqs = [] -%}
          {%- for hop in range(0, (app_list | length) + 1) if queue -%}
            {%- set current = queue.pop(0) -%}
            {%- set current_app = app_list | selectattr('name','eq',current) | first -%}
            {%- for r in current_app.requires | default([]) -%}
              {%- if r.name not in seen -%}
                {%- set _ = seen.append(r.name) -%}
                {%- set _ = queue.append(r.name) -%}
                {%- set _ = all_reqs.append(r) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {%- set _ = resolved.append(app | combine({'requires': all_reqs})) -%}
        {%- endfor -%}
        {{ resolved }}

  - name: app_list
    debug: 
      msg: "app_list:\n{{ app_list | to_nice_yaml }}"

# determine applications that are only needed as dependencies of the selected apps
# requires already holds the transitive closure, so one pass over the selected apps
# is enough. dependency-only apps stay separate from the explicitly requested ones,
# so they can be installed conditionally on the 'deps' tag.
  - name: determine dependency-only applications for limited application list
    set_fact:
      dep_names: >-
        {{ (app_list | selectattr('name','in', only_apps)
            | map(attribute='requires') | flatten
            | map(attribute='name') | list) | unique | difference(only_apps) }}
    when: only_apps is defined

# set only_apps to all apps and clear dependency-only list if not yet defined
  - name: set only_apps to include all_apps if only_apps is not defined
    set_fact:
      only_apps: "{{ app_list | map(attribute='name') | list }}"
      dep_names: []
    when: only_apps is not defined
 
  - name: turn app_list into a dict again
    set_fact:
      applications: >-
        {%- set apps = {} -%}
        {%- for item in app_list if item.name in only_apps or item.name in dep_names -%}
        {%-   set ns = item.namespace -%}
        {%-   set nm = item.name -%}
        {%-   set attrs = {} -%}
        {%-   for k, v in item.items() if k not in ['namespace', 'name'] -%}
        {%-     set _ = attrs.update({k: v}) -%}
        {%-   endfor -%}
        {#- dependency-only apps are installed only when the ansible tag deps is set -#}
        {%-   if item.name in dep_names and 'deps' not in ansible_run_tags -%}
        {%-     set _ = attrs.update({'install': false}) -%}
        {%-   endif -%}
        {%-   if ns not in apps -%}
        {%-     set _ = apps.update({ns: {}}) -%}
        {%-   endif -%}
        {%-   set _ = apps[ns].update({nm: attrs}) -%}
        {%- endfor -%}
        {{ apps }}

  - debug:
      msg: "applications:\n{{ applications | to_nice_yaml}}"
    failed_when: "'prepare' in ansible_run_tags"
